name: Explorar portal de subastas

on:
  workflow_dispatch:
  push:
    paths:
      - "explorar_subastas.py"
      - ".github/workflows/explorar.yml"

permissions:
  contents: write

concurrency:
  group: recoger-datos
  cancel-in-progress: false

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Explorar
        run: python explorar_subastas.py
        continue-on-error: true
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/expl
          cp -r data/subastas_exploracion/. /tmp/expl/ || true
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data/subastas_exploracion
          cp -r /tmp/expl/. data/subastas_exploracion/
          git add data
          git diff --cached --quiet || git commit -m "Exploracion del portal de subastas"
          git push origin HEAD:main
